name: Docs

on:
  pull_request:
  push:
    branches: [main, 'release/**']

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Headers, coverage, build and links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run headers
      - run: node tools/check-coverage.mjs
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
      - run: node tools/check-links.mjs
